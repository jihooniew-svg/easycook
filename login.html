<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCook - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>EasyCook</h1>
        <p>Simple recipes for everyday cooking.</p>
    </header>

    <main>
        <div class="auth-box">
            <h2>Welcome back!</h2>
            <p>Log in to manage your meal plans.</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="authButton">Log In</button>
            </form>

            <p id="message" role="status"></p>

            <p>New to EasyCook? <a href="signup.html">Sign up</a></p>
        </div>
    </main>

    <footer>EasyCook | Simple recipes for everyday cooking</footer>
    <script src="auth.js"></script>
</body>
</html>
